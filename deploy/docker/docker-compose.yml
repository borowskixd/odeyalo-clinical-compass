services:
  app:
    container_name: odeyalo-frontend-app
    build:
      dockerfile: ./deploy/docker/Dockerfile
      context: ../../
    command: npm start
    restart: on-failure
    expose:
      - "3000"
    networks:
      - odeyalo-network
    mac_address: 02:42:ac:18:06:01

  nginx:
    container_name: odeyalo-frontend-nginx
    image: public.ecr.aws/nginx/nginx:1.25-alpine
    build:
      dockerfile: ./deploy/docker/nginx/Dockerfile
      context: ../../
    restart: on-failure
    expose:
      - "80"
    networks:
      - odeyalo-network
    depends_on:
      - app
    mac_address: 02:42:ac:18:06:02

networks:
  odeyalo-network:
    name: odeyalo-network
    driver: bridge

services:
  frontend:
    container_name: odeyalo-frontend
    build:
      dockerfile: ./deploy/docker/dockerfile/Dockerfile.${OPERATION:-default}
      context: ../../
    restart: on-failure
    volumes:
      - /app/app
    expose:
      - "3000"
    networks:
      - odeyalo
    mac_address: 02:42:ac:18:06:01

  nginx:
    container_name: odeyalo-frontend-nginx
    image: nginx:latest
    restart: on-failure
    volumes:
      - /builds/maksim4k1/odeyalo/deploy/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    expose:
      - "80"
    ports:
      - "80:80"
    networks:
      - odeyalo
    depends_on:
      - frontend
    mac_address: 02:42:ac:18:06:02

networks:
  odeyalo:
    driver: bridge

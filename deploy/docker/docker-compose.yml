services:
  frontend:
    container_name: odeyalo-frontend
    build:
      dockerfile: ./deploy/docker/dockerfile/Dockerfile.${OPERATION:-default}
      context: ../../
    restart: on-failure
    volumes:
      - /app/app
    expose:
      - "3000"
    networks:
      - odeyalo
    mac_address: 02:42:ac:18:06:01

  nginx:
    container_name: odeyalo-frontend-nginx
    image: nginx:latest
    restart: on-failure
    volumes:
      - ./nginx/default.conf:/var/lib/docker/overlay2/248e865f720ec7563e2c587ae77084e8a38665df470d9583d5f0d401cb3555de/merged/etc/nginx/conf.d/default.conf
    expose:
      - "80"
    ports:
      - "80:80"
    networks:
      - odeyalo
    depends_on:
      - frontend
    mac_address: 02:42:ac:18:06:02

networks:
  odeyalo:
    driver: bridge

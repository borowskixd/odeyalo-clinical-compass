services:
  frontend:
    container_name: odeyalo-frontend
    build:
      dockerfile: ./deploy/docker/Dockerfile
      context: ../../
    command: npm start
    restart: on-failure
    volumes:
      - /app/app
    expose:
      - "3000"
    networks:
      - odeyalo-network
    mac_address: 02:42:ac:18:06:01

  nginx:
    container_name: odeyalo-frontend-nginx
    image: nginx:latest
    build:
      dockerfile: ./deploy/docker/nginx/Dockerfile
      context: ../../
    restart: on-failure
    expose:
      - "80"
    networks:
      - odeyalo-network
    depends_on:
      - frontend
    mac_address: 02:42:ac:18:06:02

networks:
  odeyalo-network:
    name: odeyalo-network
    driver: bridge

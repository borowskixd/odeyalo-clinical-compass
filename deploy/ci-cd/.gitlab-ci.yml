stages:
  - test
  - build
  - deploy

default:
  interruptible: true

.standart-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

lint-job:
  stage: test
  extends:
    - .standart-rules
  script:
    - docker compose -f ./deploy/docker/docker-compose.yml run --rm frontend npm run lint

build-job:
  stage: build
  extends:
    - .standart-rules
  script:
    - docker compose -f ./deploy/docker/docker-compose.yml run --rm frontend npm run build

deploy-job:
  stage: deploy
  extends:
    - .standart-rules
  script:
    - OPERATION=deploy docker compose -f ./deploy/docker/docker-compose.yml -p odeyalo up -d
  # rules:
  #   - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
#  - test
  - build
  - deploy

default:
  interruptible: true

.standart-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

#lint-job:
#  stage: test
#  extends:
#    - .standart-rules
#  script:
#    - docker compose -f ./deploy/docker/docker-compose.yml run --rm -e OPERATION=lint frontend
#  cache: []

build-job:
  stage: build
  extends:
    - .standart-rules
  script:
    - docker compose -f ./deploy/docker/docker-compose.yml build --no-cache frontend
    - docker compose -f ./deploy/docker/docker-compose.yml run --rm -e OPERATION=build frontend
  cache: []

deploy-job:
  stage: deploy
  extends:
    - .standart-rules
  script:
    - docker compose -f ./deploy/docker/docker-compose.yml -p odeyalo-frontend up -d --build
#  rules:
#    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

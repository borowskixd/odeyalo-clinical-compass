image: docker:latest

stages:
  - test
  - build
  - deploy

before_script:
  - apk add --no-cache make
  - make --version

default:
  interruptible: true

.standart-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

lint-job:
  stage: test
  extends:
    - .standart-rules
  script:
    - make lint

build-job:
  stage: build
  extends:
    - .standart-rules
  script:
    - make build

deploy-job:
  stage: deploy
  extends:
    - .standart-rules
  script:
    - OPERATION=deploy docker compose -f ./deploy/docker/docker-compose.yml -p odeyalo-frontend up -d --build
#  rules:
#    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

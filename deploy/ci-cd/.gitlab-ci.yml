stages:
  - test
  - build

default:
  image: node:20.5.1-alpine

.standart-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

lint-job:
  stage: test
  extends:
    - .standart-rules
  script:
    - npm install
    - npm run lint

build-job:
  stage: build
  extends:
    - .standart-rules
  script:
    - npm install
    - npm run build

#test

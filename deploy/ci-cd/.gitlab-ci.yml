stages:
  - build
  - test
  - deploy

default:
  interruptible: true

.standard-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build-job:
  stage: build
  extends:
    - .standard-rules
  script:
    - docker build -f ./deploy/docker/dockerfile/Dockerfile -t odeyalo-frontend-image .

lint-job:
  stage: test
  extends:
    - .standard-rules
  script:
    - docker run --rm odeyalo-frontend-image npm run lint

deploy-job:
  stage: deploy
  extends:
    - .standard-rules
  script:
    - docker compose -f ./deploy/docker/docker-compose.yml -p odeyalo-frontend up -d --build
#  rules:
#    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
